<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<script src="{{ '/assets/js/polish-typography.js?v=3' | relative_url }}" defer></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    if (!window.mermaid) return;

    document.querySelectorAll("pre > code.language-mermaid").forEach(function (code) {
      const diagram = document.createElement("pre");
      diagram.className = "mermaid";
      diagram.dataset.source = code.textContent;
      diagram.textContent = diagram.dataset.source;
      code.parentElement.replaceWith(diagram);
    });

    let mermaidRenderQueue = Promise.resolve();

    function renderMermaid(theme) {
      mermaidRenderQueue = mermaidRenderQueue.catch(function () {}).then(function () {
        const diagrams = document.querySelectorAll("pre.mermaid");
        if (diagrams.length === 0) return;

        diagrams.forEach(function (diagram) {
          diagram.removeAttribute("data-processed");
          if (diagram.dataset.source) diagram.textContent = diagram.dataset.source;
        });

        mermaid.initialize({
          startOnLoad: false,
          securityLevel: "strict",
          theme: theme === "dark" ? "dark" : "default",
        });
        return mermaid.run({ nodes: diagrams });
      }).catch(function (error) {
        console.error("Nie udało się wyrenderować diagramu Mermaid.", error);
      });

      return mermaidRenderQueue;
    }

    renderMermaid(document.documentElement.dataset.theme);
    document.addEventListener("themechange", function (event) {
      renderMermaid(event.detail.theme);
    });
  });
</script>
